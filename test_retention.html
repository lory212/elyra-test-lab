<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELYRA Save Safety 2.6 — Retention</title><style>body{background:#111827;color:#f9fafb;font:16px system-ui;margin:0 auto;max-width:850px;padding:22px}button{background:#86efac;border:0;border-radius:9px;padding:13px;font-weight:700;margin:4px}pre{background:#1f2937;padding:15px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>ELYRA Save Safety 2.6</h1><p>Laboratorio isolato per la conservazione degli snapshot. Non legge né modifica salvataggi reali. Politica candidata, non ancora integrata nel motore.</p><button id="go">Esegui 7 test</button><button id="copy">Copia rapporto</button><pre id="report">Pronto.</pre><script>
(()=>{'use strict';const DB='elyra_ss26_retention_isolated',STORE='snapshots',HEAD='heads';const te=new TextEncoder();const digest=async s=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',te.encode(s))),b=>b.toString(16).padStart(2,'0')).join('');function req(r){return new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function done(tx){return new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('abort'));tx.onerror=()=>reject(tx.error||Error('transaction error'))})}async function open(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{let db=r.result;db.createObjectStore(STORE,{keyPath:['lifeId','revision']});db.createObjectStore(HEAD,{keyPath:'lifeId'})};r.onsuccess=()=>{const db=r.result;db.onversionchange=()=>db.close();resolve(db)};r.onerror=()=>reject(r.error)})}async function reset(){await new Promise((resolve,reject)=>{const r=indexedDB.deleteDatabase(DB);r.onsuccess=resolve;r.onerror=()=>reject(r.error);r.onblocked=()=>reject(Error('database blocked'))})}async function seed(db,id,states){const records=[];for(let i=0;i<states.length;i++){const json=JSON.stringify({identity:{lifeId:id},actors:{alex:{money:100+i}},valid:states[i]});records.push({lifeId:id,revision:i+1,json,hash:await digest(json)})}const tx=db.transaction([STORE,HEAD],'readwrite');const s=tx.objectStore(STORE),h=tx.objectStore(HEAD);for(const record of records)s.put(record);h.put({lifeId:id,revision:states.length});await done(tx)}async function all(db,id){const tx=db.transaction(STORE,'readonly');const out=(await req(tx.objectStore(STORE).getAll())).filter(x=>x.lifeId===id).sort((a,b)=>a.revision-b.revision);await done(tx);return out}async function head(db,id){const tx=db.transaction(HEAD,'readonly');const h=await req(tx.objectStore(HEAD).get(id));await done(tx);return h?.revision||0}async function valid(x){try{if(await digest(x.json)!==x.hash)return false;const v=JSON.parse(x.json);return v?.valid===true&&v?.identity?.lifeId===x.lifeId&&Number.isFinite(v?.actors?.alex?.money)}catch{return false}}async function plan(db,id,keep=3){const rows=await all(db,id),h=await head(db,id);const verified=[];for(const row of rows)if(await valid(row))verified.push(row.revision);const protect=new Set(verified.slice(-keep));const deletion=rows.filter(x=>!protect.has(x.revision)&&x.revision!==h).map(x=>x.revision);return {lifeId:id,head:h,verified,protected:[...protect],deletion,reason:verified.length?'SAFE_PLAN':'NO_VALID_SNAPSHOT'}}async function apply(db,p){if(p.reason!=='SAFE_PLAN'||p.protected.length<1)throw Error('UNSAFE_PLAN');const tx=db.transaction([STORE,HEAD],'readwrite');const s=tx.objectStore(STORE),h=tx.objectStore(HEAD);const current=await req(h.get(p.lifeId));if((current?.revision||0)!==p.head){tx.abort();try{await done(tx)}catch{}throw Error('HEAD_CHANGED')}for(const rev of p.deletion)s.delete([p.lifeId,rev]);await done(tx)}async function run(){let db;const tests=[];async function test(name,fn){try{const details=await fn();tests.push({name,result:'PASS',details})}catch(e){tests.push({name,result:'FAIL',error:String(e)})}}try{await reset();db=await open();await seed(db,'lifeA',[true,true,true,true,true,true]);await seed(db,'lifeB',[true,true]);await test('anteprima non cancella revisioni',async()=>{const p=await plan(db,'lifeA');if((await all(db,'lifeA')).length!==6||p.deletion.length!==3)throw Error('plan');return {total:6,candidates:p.deletion}});await test('mantiene tre copie valide e HEAD',async()=>{const p=await plan(db,'lifeA');await apply(db,p);const rows=await all(db,'lifeA');if(rows.length!==3||rows.some(x=>![4,5,6].includes(x.revision))||await head(db,'lifeA')!==6)throw Error('retention');return {revisions:rows.map(x=>x.revision),head:6}});await test('altra vita indipendente',async()=>{const rows=await all(db,'lifeB');if(rows.length!==2||await head(db,'lifeB')!==2)throw Error('other life');return {revisions:rows.length}});await test('non elimina HEAD anche se invalido',async()=>{await seed(db,'lifeC',[true,true,false]);const p=await plan(db,'lifeC',1);await apply(db,p);const rows=await all(db,'lifeC');if(!rows.some(x=>x.revision===3)||!rows.some(x=>x.revision===2))throw Error('head lost');return {revisions:rows.map(x=>x.revision),head:3}});await test('nessuna copia valida: blocco pulizia',async()=>{await seed(db,'lifeD',[false,false,false]);const p=await plan(db,'lifeD');if(p.reason!=='NO_VALID_SNAPSHOT')throw Error('reason');let rejected=false;try{await apply(db,p)}catch(e){rejected=String(e).includes('UNSAFE_PLAN')}if(!rejected||(await all(db,'lifeD')).length!==3)throw Error('unsafe deletion');return {status:p.reason,snapshots:3}});await test('HEAD modificato: piano obsoleto rifiutato',async()=>{await seed(db,'lifeE',[true,true,true,true]);const p=await plan(db,'lifeE',2);const tx=db.transaction(HEAD,'readwrite');tx.objectStore(HEAD).put({lifeId:'lifeE',revision:5});await done(tx);let rejected=false;try{await apply(db,p)}catch(e){rejected=String(e).includes('HEAD_CHANGED')}if(!rejected||(await all(db,'lifeE')).length!==4)throw Error('stale plan');return {rejected:true,remaining:4}});await test('snapshot verificato dopo pulizia',async()=>{const rows=await all(db,'lifeA');for(const r of rows)if(!await valid(r))throw Error('bad snapshot');return {verified:rows.length,latest:rows.at(-1).revision}})}catch(e){tests.push({name:'inizializzazione',result:'FAIL',error:String(e)})}finally{db?.close()}const report={environment:{origin:location.origin,indexedDB:!!indexedDB,cryptoSubtle:!!crypto?.subtle},scope:'Isolated IndexedDB retention policy prototype; not original ELYRA engine',limitations:['No real quota exhaustion, process kill or production saves','Simplified semantic validator, not engine.validate','Retention policy is experimental; no production integration'],tests};document.getElementById('report').textContent=JSON.stringify(report,null,2);window.__report=report}document.getElementById('go').onclick=run;document.getElementById('copy').onclick=async()=>{if(!window.__report)return;try{await navigator.clipboard.writeText(JSON.stringify(window.__report,null,2));alert('Rapporto copiato')}catch(e){alert('Copia manualmente il rapporto')}}})();
</script></html>
