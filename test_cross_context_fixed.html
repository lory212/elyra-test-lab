</script><script>const child="<!doctype html><meta charset=\"utf-8\"><script>/* ELYRA SaveCore 3.1 \u2014 isolated laboratory, not integrated with ELYRA. */\n(function(global){'use strict';\nconst DB='elyra_savecore_crosscontext15_lab',VERSION=1,SNAP='snapshots',HEAD='heads';\nconst enc=new TextEncoder();\nconst hash=async s=>Array.from(new Uint8Array(await global.crypto.subtle.digest('SHA-256',enc.encode(s))),x=>x.toString(16).padStart(2,'0')).join('');\nfunction lifeId(id){if(typeof id!=='string'||!id.trim()||id.length>200)throw Error('Invalid life ID');}\nfunction validState(id,s){if(!s||typeof s!=='object'||Array.isArray(s)||s.identity?.lifeId!==id)throw Error('Invalid life identity');}\nfunction open(){return new Promise((ok,no)=>{if(!global.indexedDB)return no(Error('IndexedDB unavailable'));const r=global.indexedDB.open(DB,VERSION);r.onupgradeneeded=()=>{let db=r.result;if(!db.objectStoreNames.contains(SNAP)){let s=db.createObjectStore(SNAP,{keyPath:'id'});s.createIndex('lifeId','lifeId',{unique:false});}if(!db.objectStoreNames.contains(HEAD))db.createObjectStore(HEAD,{keyPath:'lifeId'});};r.onsuccess=()=>{const db=r.result;db.onversionchange=()=>db.close();ok(db);};r.onerror=()=>no(r.error||Error('Open failed'));r.onblocked=()=>no(Error('Database upgrade blocked'));});}\nfunction atomicWrite(db,id,json,digest){return new Promise((ok,no)=>{\n let tx;try{tx=db.transaction([SNAP,HEAD],'readwrite');}catch(e){return no(e);}\n const h=tx.objectStore(HEAD),s=tx.objectStore(SNAP);\n const head=h.get(id),index=s.index('lifeId');\n // The latest snapshot, not HEAD alone, determines the next revision.\n // This protects against missing/stale HEAD and preserves all orphaned snapshots.\n const latest=index.openCursor(IDBKeyRange.only(id),'prev');\n let headRevision=0,snapshotRevision=0,checks=0,revision;\n function ready(){if(++checks!==2)return;\n   revision=Math.max(headRevision,snapshotRevision)+1;\n   s.add({id:id+'::'+String(revision).padStart(12,'0'),lifeId:id,revi
